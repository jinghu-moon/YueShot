name: YueShot Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # The reviewed app-local runtime contract is VS 2022 / VC143.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned NASM for the AVIF assembly checks
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nasm-3.01-win64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'yueshot-nasm'
          Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'E0BA5157007ABC7B1A65118A96657A961DDF55F7E3F632EE035366DFCE039CA4') {
            throw 'Unexpected NASM archive hash'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $nasmDirectory = Join-Path $destination 'nasm-3.01'
          $version = & (Join-Path $nasmDirectory 'nasm.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^NASM version 3\.01 compiled on ') { throw 'Unexpected NASM version' }
          Write-Output $version
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/delivery/package-lock.json
      - name: Verify the official VC143 redistributable before building
        run: python -c "import sys; sys.path.insert(0, 'tools'); from yueshot_runtime import find_vc_redist; print(find_vc_redist())"
      - run: npm ci --prefix tools/delivery
      - name: Audit Windows packaging dependencies
        run: npm audit --prefix tools/delivery --audit-level=low
      - uses: actions/cache/restore@v4
        id: audit-tools
        with:
          path: |
            ~/.cargo/bin/cargo-deny.exe
            ~/.cargo/bin/cargo-audit.exe
          key: windows-x64-rust-1.98.1-deny-0.20.2-audit-0.22.1
      - run: cargo install cargo-deny --version 0.20.2 --locked
        if: steps.audit-tools.outputs.cache-hit != 'true'
      - run: cargo install cargo-audit --version 0.22.1 --locked
        if: steps.audit-tools.outputs.cache-hit != 'true'
      - name: Verify audit tool versions
        run: |
          if ((cargo deny --version) -ne 'cargo-deny 0.20.2') { throw 'Unexpected cargo-deny version' }
          if ((cargo audit --version) -ne 'cargo-audit-audit 0.22.1') { throw 'Unexpected cargo-audit version' }
      - uses: actions/cache/save@v4
        if: steps.audit-tools.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/cargo-deny.exe
            ~/.cargo/bin/cargo-audit.exe
          key: windows-x64-rust-1.98.1-deny-0.20.2-audit-0.22.1
      - name: Fetch locked Windows dependencies for offline audits
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: cargo xtask check
      - run: python tools/yueshot_security.py --output target/yueshot-security
      - run: cargo xtask package --profile release
      - name: Smoke test the installed payload
        run: |
          $candidates = @(Get-ChildItem target/yueshot-delivery -Directory -Filter '*-release')
          if ($candidates.Count -ne 1) { throw 'Expected one release candidate in this clean job.' }
          ./tools/test-yueshot-install.ps1 -Candidate $candidates[0].FullName
          ./tools/test-yueshot-installer-policy.ps1 -Candidate $candidates[0].FullName
          ./tools/test-yueshot-channel-install.ps1 -Candidate $candidates[0].FullName
          python tools/test-yueshot-window-close.py --binary (Join-Path $candidates[0].FullName 'bin/YueShot.exe') --output target/window-close-native
          if ($LASTEXITCODE -ne 0) { throw 'Native close-to-tray regression failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: yueshot-unsigned-windows-x64-candidate
          path: target/yueshot-delivery
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Download the uploaded candidate for verification
        uses: actions/download-artifact@v4
        with:
          name: yueshot-unsigned-windows-x64-candidate
          path: target/yueshot-artifact-review
      - name: Verify the candidate after artifact transport
        run: |
          $candidates = @(Get-ChildItem target/yueshot-artifact-review -Directory -Filter '*-release')
          if ($candidates.Count -ne 1) { throw 'Expected one downloaded release candidate.' }
          python tools/yueshot-delivery.py verify $candidates[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded candidate verification failed.' }
