name: YueShot Windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ['yueshot-v*']
  workflow_dispatch:
    inputs:
      delivery:
        description: Build and validate an unsigned installer after all checks pass
        type: boolean
        default: false
      cold_build:
        description: Bypass Rust build caches in both jobs (clean build qualification)
        type: boolean
        default: false

permissions:
  contents: read

# New commits supersede unfinished runs on the same branch/PR, not other refs.
concurrency:
  group: yueshot-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'

jobs:
  verify:
    # The reviewed app-local runtime contract is VS 2022 / VC143.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Windows verification environment
        id: setup
        uses: ./.github/actions/windows-setup
        with:
          profile: debug
          cold-cache: ${{ inputs.cold_build || false }}
      - run: cargo xtask check
      - run: python tools/yueshot_security.py --output target/yueshot-security
      - name: Save successful verification compilation cache
        if: github.ref == 'refs/heads/main' && !inputs.cold_build && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ steps.setup.outputs.cache-key }}

  delivery:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/yueshot-v') || (github.event_name == 'workflow_dispatch' && inputs.delivery)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Windows delivery environment
        id: setup
        uses: ./.github/actions/windows-setup
        with:
          profile: release
          cold-cache: ${{ inputs.cold_build || false }}
      - run: cargo xtask package --profile release
      - name: Smoke test the installed payload
        run: |
          $candidates = @(Get-ChildItem target/yueshot-delivery -Directory -Filter '*-release')
          if ($candidates.Count -ne 1) { throw 'Expected one release candidate in this clean job.' }
          ./tools/test-yueshot-install.ps1 -Candidate $candidates[0].FullName
          ./tools/test-yueshot-installer-policy.ps1 -Candidate $candidates[0].FullName
          ./tools/test-yueshot-channel-install.ps1 -Candidate $candidates[0].FullName
          python tools/test-yueshot-window-close.py --binary (Join-Path $candidates[0].FullName 'bin/YueShot.exe') --output target/window-close-native
          if ($LASTEXITCODE -ne 0) { throw 'Native close-to-tray regression failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: yueshot-unsigned-windows-x64-candidate
          path: target/yueshot-delivery
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Download the uploaded candidate for verification
        uses: actions/download-artifact@v4
        with:
          name: yueshot-unsigned-windows-x64-candidate
          path: target/yueshot-artifact-review
      - name: Verify the candidate after artifact transport
        run: |
          $candidates = @(Get-ChildItem target/yueshot-artifact-review -Directory -Filter '*-release')
          if ($candidates.Count -ne 1) { throw 'Expected one downloaded release candidate.' }
          python tools/yueshot-delivery.py verify $candidates[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded candidate verification failed.' }
      - name: Save successful delivery compilation cache
        if: github.ref == 'refs/heads/main' && !inputs.cold_build && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.setup.outputs.cache-key }}
