[package]
name = "yue-shot-storage"
version = "0.1.0"
description = "YueShot-owned screenshot artifacts and bounded pixel masters"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
log = "0.4"
yue-shot-model = { path = "../yue-shot-model" }
yue-media = { path = "../../../../crates/yue-media" }
blake3 = "1.5"
flate2 = "1"
half = { version = "2.7", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
