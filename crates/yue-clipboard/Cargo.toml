[package]
name = "yue-clipboard"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
yue-media = { path = "../yue-media" }
png = "0.18"
[dev-dependencies]
half = { version = "2.7", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
[target.'cfg(not(windows))'.dependencies]
arboard = "3.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem",
  "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory",
  "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
