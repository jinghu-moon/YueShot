[licenses]
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { crate = "zenjpeg@0.8.4", allow = ["AGPL-3.0-only"] },
    { crate = "zenwebp@0.4.4", allow = ["AGPL-3.0-only"] },
]

[licenses.private]
ignore = false
